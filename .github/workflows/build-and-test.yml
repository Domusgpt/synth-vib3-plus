# Build, Test, and Deploy to Firebase Test Lab
#
# This workflow:
# 1. Builds debug and release APKs
# 2. Runs unit tests
# 3. Uploads APKs as downloadable artifacts
# 4. Runs Firebase Test Lab instrumentation tests
#
# A Paul Phillips Manifestation

name: Build & Test

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'

jobs:
  # ====================
  # Build APKs
  # ====================
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Instrumentation Test APK
        run: |
          cd android
          ./gradlew app:assembleAndroidTest
          ./gradlew app:assembleDebug -Ptarget=integration_test/app_test.dart

      # Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/apk/release/app-release.apk
          retention-days: 30

      # Upload Test APK
      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: app-test
          path: build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 30

  # ====================
  # Unit Tests
  # ====================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

  # ====================
  # Firebase Test Lab
  # ====================
  firebase-test-lab:
    name: Firebase Test Lab
    runs-on: ubuntu-latest
    needs: build
    # Only run on main branch or manual trigger
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk/

      - name: Download Test APK
        uses: actions/download-artifact@v4
        with:
          name: app-test
          path: apk/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Test Lab
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app apk/app-debug.apk \
            --test apk/app-debug-androidTest.apk \
            --device model=oriole,version=33 \
            --device model=redfin,version=30 \
            --timeout 20m \
            --results-bucket gs://${{ secrets.GCS_BUCKET }} \
            --results-dir "test-results-${{ github.run_id }}"

      - name: Download Test Results
        if: always()
        run: |
          gsutil -m cp -r "gs://${{ secrets.GCS_BUCKET }}/test-results-${{ github.run_id }}" ./test-results/ || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-results
          path: test-results/
          retention-days: 30
